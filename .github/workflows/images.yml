name: images

# Builds the sheng boot and userdata images from the newest UniXNU organization
# commits on macOS runners:
#   device repository  UniXNU/UniXNU-sheng   main
#   build tools        UniXNU/UniXNU         main
#   UEFI firmware      UniXNU/uefi-sheng     main
#
# UniXNU/UniXNU-sheng keeps the three WCN7850 firmware binaries out of Git
# (firmware/README.md: "Firmware binaries stay local; the repository contains the
# manifest and packaging code"). The boot job fetches them from a public sheng
# port and verifies every byte against this repository's firmware/wcn7850/
# manifest.json before the build; a changed or truncated file stops the run.
#
# The run publishes images-27 (boot.img, payload.img, kernel.macho and the
# manifest) and userdata-root-27 (userdata-root.img and its report) for one day
# each. Download them, then delete the run.

on:
  push:
    branches: [build/unixnu-sources, build/ios-pairing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          # The newest upstream device commit whose iPadOS link does not need
          # macOS-only kernel symbols; main since 67e0248 does.
          ref: a68ee4ee67cc71792fbf519de7e3e28072c717b5
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # The same day's UniXNU: before 47ec6a5 drops the sheng- boot argument
          # names this device still passes.
          ref: 95ad78129203442c3c14c02336303adbddf8d0a3
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: main
          path: uefi-sheng
          submodules: recursive
      - name: provide the WCN7850 firmware inputs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request
          root = pathlib.Path('device/firmware/wcn7850')
          pins = json.loads((root / 'manifest.json').read_text())['files']
          base = ('https://raw.githubusercontent.com/ks114514/UniXNU-sheng/'
                  '6f4792fe416ea88ce0aab1bcd480b430f4807165/firmware/wcn7850/')
          for name in ('amss.bin', 'm3.bin', 'board-2.bin'):
              with urllib.request.urlopen(base + name, timeout=300) as source:
                  data = source.read()
              pin = pins[name]
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != pin['bytes'] or digest != pin['sha256']:
                  raise SystemExit(f'{name}: {len(data)} bytes sha256 {digest} '
                                   f'does not match the pinned manifest')
              (root / name).write_bytes(data)
              print(name, len(data), digest)
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      # This unit's userdata is 105.2 GiB, not the 232 GiB the board file was
      # written for. Shrink the Data store to 88 GiB and record the real last
      # LBA so the capacity check matches, then create a fresh seed from the
      # IPSW (--init-data) instead of the cached 215 GiB one.
      - name: fit the Data store to this unit's userdata
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path('device/board.toml')
          text = path.read_text()
          if 'data_gib = 215' not in text:
              sys.exit('board.toml data_gib 215 not found')
          text = text.replace('data_gib = 215', 'data_gib = 88', 1)
          if '"last_lba" = 64007162' not in text:
              sys.exit('board.toml last_lba 64007162 not found')
          text = text.replace('"last_lba" = 64007162', '"last_lba" = 30669818', 1)
          path.write_text(text)
          print('board.toml: data_gib 88, userdata last_lba 30669818')
          PY
          rm -f UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
          rm -f UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
      # build-wifi-userspace.py builds the native supplicant from the locked
      # Linux, FreeBSD and wpa_supplicant sources under drivers/Ath12kWifi/deps.
      # fetch-sources.py clones them, but asks sparse-checkout for cone-mode
      # patterns that carry a leading slash, which the runner's git rejects.
      # Fetch here with the patterns stripped and in no-cone mode.
      - name: prepare the locked Wi-Fi supplicant sources
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path('device/drivers/Ath12kWifi/tools/fetch-sources.py')
          text = path.read_text()
          old = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "add", *source["paths"]], check=True)'
          new = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "set", "--no-cone", *paths], check=True)'
          if old not in text:
              sys.exit('fetch-sources.py no longer matches the workflow patch')
          path.write_text(text.replace(old, new))
          PY
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py
      # The device repository pins the SoC source at a9f45dc6, whose
      # kits/Sm8550Platform has no Sm8550GeniUart.h; package/BluetoothProbe.cpp
      # includes it and fails the -Werror compile. 97665e28, the current SoC
      # main, carries the header; feeds.toml wins over unixnu.lock for schema 2.
      - name: pin the SoC source that carries Sm8550GeniUart.h
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          pin = '97665e28578483082b674e8375a8fa65f4cf49cf'
          path = pathlib.Path('device/feeds.toml')
          text = path.read_text()
          pattern = re.compile(r'(kind = "soc"\r?\nname = "sm8550"\r?\ngit = "[^"]+"\r?\ncommit = ")[0-9a-f]{40}(")')
          if not pattern.search(text):
              sys.exit('feeds.toml sm8550 entry changed')
          path.write_text(pattern.sub(lambda match: match.group(1) + pin + match.group(2), text))
          print('sm8550 pinned to', pin)
          PY
      # arm64e has no prebuilt std: cargo builds std and panic_unwind from
      # rust-src on the runner, which needs more than the script's 30 minutes.
      - name: allow the Rust bridge build more time
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path('UniXNU/scripts/build-adreno-metal-bridge.py')
          text = path.read_text()
          if 'timeout=1800' not in text:
              sys.exit('build-adreno-metal-bridge.py timeout changed')
          path.write_text(text.replace('timeout=1800', 'timeout=7200'))
          print('cargo timeout raised to 7200 s')
          PY
      # build-gop-legacy-display-27.py aborts without the keyboard controller's
      # RAM image; proprietary-files.txt pins it under the Keyboard section and
      # extract-files.py fetches it from the listed public mirror by SHA-256.
      - name: extract the keyboard firmware input
        working-directory: device
        run: python3 scripts/extract-files.py --section Keyboard
      # 95ad781 records turnip-frame-diagnostics.patch without the "new file
      # mode" line of its first file, so git apply stops at "dev/null: No such
      # file or directory". e7c359c in UniXNU adds the line.
      - name: repair the pinned mesa patch header
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path('UniXNU/patches/mesa/turnip-frame-diagnostics.patch')
          header = '+++ b/src/freedreno/vulkan/tu_frame_diagnostic.h\n'
          text = path.read_text()
          repaired = text.replace('--- /dev/null\n' + header, 'new file mode 100644\n--- /dev/null\n' + header, 1)
          if repaired == text and 'new file mode 100644\n--- /dev/null\n' + header not in text:
              sys.exit('mesa patch header not found in ' + str(path))
          path.write_text(repaired)
          print('repaired', path)
          PY
      # The Xiaomi ABL on this unit rejects Android boot header v0 with
      # "Failed to load/authenticate boot image: Load Error" and only loads a
      # v4 header. uefi-sheng's Resources/Configs/sheng.toml asks for v0, so
      # override the header version for this build.
      - name: use the boot header version the ABL loads
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path('device/board.toml')
          text = path.read_text()
          if '["bootimg"."image"]' in text:
              sys.exit('board.toml already carries a bootimg.image table')
          path.write_text(text.rstrip('\n') + '\n\n["bootimg"."image"]\n"header_version" = 4\n')
          print('board.toml: [bootimg.image] header_version = 4')
          PY
      # The sheng payload is ~136 MiB and the ABL only hands the firmware the
      # vendor_boot vendor ramdisk, whose 96 MiB partition is too small. Teach
      # UniXNURamDiskDxe to expand an LZMA-compressed initrd, keeping the
      # uncompressed path for every other build.
      - name: add the compressed initrd path to the ramdisk driver
        run: |
          curl -fsSL "https://raw.githubusercontent.com/HYL0924/UniXNU-sheng/${GITHUB_SHA}/.github/patches/UniXNURamDiskDxe-lzma.c" -o /tmp/ramdisk-lzma.c
          cp /tmp/ramdisk-lzma.c UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c
          python3 - <<'PY'
          import pathlib
          dsc = pathlib.Path('uefi-sheng/Platforms/Xiaomi/shengPkg/sheng.dsc')
          text = dsc.read_text()
          if '[LibraryClasses.common.DXE_DRIVER]' in text:
              raise SystemExit('sheng.dsc already has a DXE_DRIVER library section')
          inc = pathlib.Path('uefi-sheng/Silicon/Qualcomm/KailuaPkg/KailuaPkg.dsc.inc')
          everything = text + (inc.read_text() if inc.is_file() else '')
          block = ('\n[LibraryClasses.common.DXE_DRIVER]\n'
                   '  NULL|MdeModulePkg/Library/LzmaCustomDecompressLib/LzmaCustomDecompressLib.inf\n')
          if 'ExtractGuidedSectionLib|' not in everything:
              block += ('  ExtractGuidedSectionLib|MdePkg/Library/DxeExtractGuidedSectionLib/'
                        'DxeExtractGuidedSectionLib.inf\n')
          dsc.write_text(text.rstrip('\n') + '\n' + block)
          print('sheng.dsc: LZMA ramdisk support wired in')
          PY
      - name: record the source revisions
        run: |
          git -C device rev-parse HEAD
          git -C UniXNU rev-parse HEAD
          git -C uefi-sheng rev-parse HEAD
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os 27 --uefi ../uefi-sheng --init-data
      - name: show the failing archive log
        if: failure()
        run: |
          found=0
          for f in UniXNU/out/sheng/*/*/logs/archive-*.log; do
            if grep -q 'error:' "$f" 2>/dev/null; then
              echo "==== $f"
              grep -n -B6 -A16 'error:' "$f" | tail -n 160
              found=1
            fi
          done
          [ "$found" = 1 ] || echo 'no archive log carries an error: line'
      # Redact the platform seed before the logs leave the runner.
      - name: keep the build logs
        if: failure()
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if [ -n "$SEED" ]; then
            grep -rl -- "$SEED" UniXNU/out/sheng/*/*/logs 2>/dev/null | xargs -r sed -i "s/$SEED/<redacted>/g" || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-27
          retention-days: 1
          if-no-files-found: warn
          path: UniXNU/out/sheng/*/*/logs/**
      - name: installation seed backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-27
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json

  userdata:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: a68ee4ee67cc71792fbf519de7e3e28072c717b5
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 95ad78129203442c3c14c02336303adbddf8d0a3
          path: UniXNU
      - name: tools
        run: |
          brew install blacktop/tap/ipsw
          ok=1
          for t in hdiutil aea ipsw python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: disk
        run: df -h /
      - name: select the configuration
        working-directory: device
        run: python3 ../UniXNU/unixnu defconfig sheng_ipados27_defconfig -D .
      - name: build userdata
        working-directory: device
        run: python3 ../UniXNU/unixnu build userdata -D . --os 27
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-root-27
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
