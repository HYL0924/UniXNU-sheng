name: images

# Builds the sheng boot and userdata images from the newest UniXNU organization
# commits on macOS runners:
#   device repository  UniXNU/UniXNU-sheng   main
#   build tools        UniXNU/UniXNU         main
#   UEFI firmware      UniXNU/uefi-sheng     main
#
# UniXNU/UniXNU-sheng keeps the three WCN7850 firmware binaries out of Git
# (firmware/README.md: "Firmware binaries stay local; the repository contains the
# manifest and packaging code"). The boot job fetches them from a public sheng
# port and verifies every byte against this repository's firmware/wcn7850/
# manifest.json before the build; a changed or truncated file stops the run.
#
# The run publishes images-27 (boot.img, payload.img, kernel.macho and the
# manifest) and userdata-root-27 (userdata-root.img and its report) for one day
# each. Download them, then delete the run.

on:
  push:
    branches: [build/unixnu-sources]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: main
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: main
          path: uefi-sheng
          submodules: recursive
      - name: provide the WCN7850 firmware inputs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request
          root = pathlib.Path('device/firmware/wcn7850')
          pins = json.loads((root / 'manifest.json').read_text())['files']
          base = ('https://raw.githubusercontent.com/ks114514/UniXNU-sheng/'
                  '6f4792fe416ea88ce0aab1bcd480b430f4807165/firmware/wcn7850/')
          for name in ('amss.bin', 'm3.bin', 'board-2.bin'):
              with urllib.request.urlopen(base + name, timeout=300) as source:
                  data = source.read()
              pin = pins[name]
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != pin['bytes'] or digest != pin['sha256']:
                  raise SystemExit(f'{name}: {len(data)} bytes sha256 {digest} '
                                   f'does not match the pinned manifest')
              (root / name).write_bytes(data)
              print(name, len(data), digest)
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-27
      - name: require the saved Data seed
        run: |
          seed=UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
          if [ ! -f "$seed" ]; then
            echo 'No saved Data seed in the cache.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os 27 --uefi ../uefi-sheng
      - name: installation seed backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-27
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-27
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json

  userdata:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: main
          path: device
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
      - name: tools
        run: |
          brew install blacktop/tap/ipsw
          ok=1
          for t in hdiutil aea ipsw python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: disk
        run: df -h /
      - name: select the configuration
        working-directory: device
        run: python3 ../UniXNU/unixnu defconfig sheng_ipados27_defconfig -D .
      - name: build userdata
        working-directory: device
        run: python3 ../UniXNU/unixnu build userdata -D . --os 27
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-root-27
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
